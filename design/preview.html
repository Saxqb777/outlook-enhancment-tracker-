<title>Docket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a filing-rail sidebar and a sticky command bar over a work surface of sheets. The case view splits the source email from its Points; highlighter traces link each Point to the sentence it came from. */
:root{
  --paper:#F1F2F5;--sheet:#FFFFFF;--sheet-2:#F6F7F9;--ink:#141A29;--ink-2:#485066;--ink-3:#666D86;--rule:#E1E4EB;--rule-2:#C8CEDA;
  --marker:#FFDC3A;--marker-wash:rgba(255,220,58,.62);--focus:#141A29;
  --s-todo:#8A91A5;--s-progress:#2F5BEA;--s-wait:#B97A0B;--s-done:#12936A;--s-approved:#141A29;--s-late:#D03B3B;
  --bar-past:#C3C9D6;--btn:#141A29;--btn-ink:#FFFFFF;--toast:#141A29;--toast-ink:#F1F2F5;--toast-act:#FFDC3A;
  --scrim:rgba(13,17,26,.34);
  --shadow:0 1px 2px rgba(20,26,41,.06),0 14px 36px -10px rgba(20,26,41,.24);
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;--top-h:61px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C0F15;--sheet:#141821;--sheet-2:#1A1F2A;--ink:#E6E8EE;--ink-2:#AAB0BF;--ink-3:#868DA0;--rule:#242A36;--rule-2:#363D4C;
  --marker:#F2D33A;--marker-wash:rgba(242,211,58,.36);--focus:#F2D33A;
  --s-todo:#6E7589;--s-progress:#5B7FFF;--s-wait:#B57E1C;--s-done:#16A06A;--s-approved:#E6E8EE;--s-late:#EF5B5B;
  --bar-past:#394052;--btn:#E6E8EE;--btn-ink:#0C0F15;--toast:#E6E8EE;--toast-ink:#0C0F15;--toast-act:#6E5200;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 2px rgba(0,0,0,.5),0 18px 44px -10px rgba(0,0,0,.75);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C0F15;--sheet:#141821;--sheet-2:#1A1F2A;--ink:#E6E8EE;--ink-2:#AAB0BF;--ink-3:#868DA0;--rule:#242A36;--rule-2:#363D4C;
  --marker:#F2D33A;--marker-wash:rgba(242,211,58,.36);--focus:#F2D33A;
  --s-todo:#6E7589;--s-progress:#5B7FFF;--s-wait:#B57E1C;--s-done:#16A06A;--s-approved:#E6E8EE;--s-late:#EF5B5B;
  --bar-past:#394052;--btn:#E6E8EE;--btn-ink:#0C0F15;--toast:#E6E8EE;--toast-ink:#0C0F15;--toast-act:#6E5200;
  --scrim:rgba(0,0,0,.55);--shadow:0 1px 2px rgba(0,0,0,.5),0 18px 44px -10px rgba(0,0,0,.75);color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:var(--paper)}
::selection{background:var(--marker-wash)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-xs{width:14px;height:14px}
.cid,time,.mono{font-family:var(--f-mono)}
.cid{font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
kbd{font:500 11px/1 var(--f-mono);color:var(--ink-3);border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:2px 5px;background:var(--sheet)}
q{quotes:"\201C" "\201D"}

/* status colour hooks */
.st-todo{--c:var(--s-todo)}.st-progress{--c:var(--s-progress)}.st-wait{--c:var(--s-wait)}.st-done{--c:var(--s-done)}.st-approved{--c:var(--s-approved)}.st-late{--c:var(--s-late)}
.sg{width:14px;height:14px;color:var(--c);flex:none}

/* preview strip */
.pv{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--sheet);border-bottom:1px dashed var(--rule-2);font-size:12.5px;color:var(--ink-2)}
.pv p{margin:0;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.pv b{color:var(--ink);font-weight:700;font-stretch:112%}
.pv-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
@media (min-width:900px){.pv{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:16px 12px 14px max(12px,env(safe-area-inset-left,0px));background:var(--sheet);border-right:1px solid var(--rule);overflow-y:auto}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px;font-weight:800;font-stretch:125%;font-size:18px;letter-spacing:-.02em}
.logo{width:24px;height:24px;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;height:36px;padding:0 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav a:hover{background:var(--sheet-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:650;background:var(--sheet-2)}
.nav a[aria-current="page"] .lab{background:linear-gradient(var(--marker-wash),var(--marker-wash)) 0 80%/100% 46% no-repeat;padding:0 3px;margin:0 -3px}
.nav kbd{margin-left:auto;opacity:0;transition:opacity .15s}
.nav a:hover kbd,.nav a:focus-visible kbd{opacity:1}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--rule)}
.side-foot div b{display:block;font-weight:650;font-size:13px}
.side-foot div span{display:block;font-size:12px;color:var(--ink-3)}
.main-col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:color-mix(in oklab,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
@media (min-width:900px){.top{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.brand-m{display:none;padding:0;font-size:16px}
.search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px 0 11px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink-3);font-size:13.5px;transition:border-color .15s}
.search:hover{border-color:var(--rule-2)}
.search span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sp{flex:1}
.icon-btn{position:relative;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--rule-2)}
.icon-btn.sm{width:30px;height:30px;border-radius:7px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--s-late);color:#fff;font:700 10.5px/18px var(--f-ui);text-align:center;box-shadow:0 0 0 2px var(--paper)}
.page{padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.page{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.page-in{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.page-in.enter{animation:enter .26s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}

/* mobile nav */
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:11px;font-weight:600;color:var(--ink-3)}
.bnav a[aria-current="page"]{color:var(--ink)}
.bnav a[aria-current="page"] .i{color:var(--ink)}
.bnav .b-add .i{width:36px;height:36px;padding:9px;border-radius:50%;background:var(--btn);color:var(--btn-ink);margin-top:-6px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .brand-m{display:flex}
  .bnav{display:flex}
  .search kbd{display:none}
  .page{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* type */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap}
.ph>div:first-child{min-width:0;flex:1 1 360px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.date{font:500 12px var(--f-mono);color:var(--ink-3)}
.h1{margin:2px 0 0;font-weight:800;font-stretch:125%;font-size:clamp(23px,2.5vw,31px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
.lede{margin:8px 0 0;max-width:68ch;color:var(--ink-2);font-size:15px;line-height:1.5}
.lede b{color:var(--ink);font-weight:650}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);padding:2px 0}
.back:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:8px;font-weight:650;font-size:13.5px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{background:var(--sheet-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn-primary:hover{background:color-mix(in oklab,var(--btn) 86%,var(--paper));border-color:color-mix(in oklab,var(--btn) 86%,var(--paper))}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--sheet-2);border-color:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px;gap:5px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn-add{justify-content:flex-start;height:38px;padding:0 12px}
.btn-add kbd{margin-left:auto;color:inherit;opacity:.55;border-color:currentColor;background:transparent}
.link-btn{font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* segmented + chips */
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--sheet-2);border:1px solid var(--rule);gap:2px;flex-wrap:wrap}
.seg button,.seg a{height:28px;padding:0 11px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover,.seg a:hover{color:var(--ink)}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(20,26,41,.08),0 0 0 1px var(--rule)}
.seg .n{font:500 11px var(--f-mono);color:var(--ink-3)}
.seg-pv button{height:26px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--rule);background:var(--sheet);font-size:13px;font-weight:550;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chip.all{padding-left:12px}
.chip:hover{border-color:var(--rule-2);color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}

/* avatars, pills, chips */
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:650 10px/1 var(--f-ui);font-stretch:110%;letter-spacing:.02em;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule-2);flex:none}
.av.lead{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.av-xs{width:20px;height:20px;font-size:8.5px}
.av-md{width:32px;height:32px;font-size:11px}
.av-lg{width:52px;height:52px;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border-radius:999px;font-size:12px;font-weight:650;color:var(--ink);background:color-mix(in oklab,var(--c) 12%,var(--sheet));border:1px solid color-mix(in oklab,var(--c) 34%,var(--sheet));white-space:nowrap}
button.pill:hover{border-color:var(--c)}
.pill .i{width:12px;height:12px;color:var(--ink-3)}
.due{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:550;color:var(--ink-2);border:1px solid var(--rule);background:var(--sheet);white-space:nowrap}
button.due:hover{border-color:var(--rule-2);color:var(--ink)}
.due .i{width:13px;height:13px}
.due.soon{color:var(--ink);font-weight:650;border-color:var(--rule-2)}
.due.late{color:var(--s-late);font-weight:650;border-color:color-mix(in oklab,var(--s-late) 40%,var(--sheet));background:color-mix(in oklab,var(--s-late) 7%,var(--sheet))}
.due.none{color:var(--ink-3);border-style:dashed}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.prio svg{width:12px;height:12px;color:var(--ink)}
.prio-high{color:var(--ink);font-weight:600}
.count{display:inline-block;font:600 11px/1.5 var(--f-mono);color:var(--ink-2);background:var(--sheet-2);border:1px solid var(--rule);border-radius:999px;padding:0 7px;vertical-align:1px}
.stamp{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;padding:4px 7px;transform:rotate(-2deg);white-space:nowrap}
.stamp.sm{font-size:10px;padding:3px 6px}
.stamp.fresh{animation:stamp .42s cubic-bezier(.3,1.4,.5,1)}
@keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-8deg)}to{opacity:1;transform:scale(1) rotate(-2deg)}}
.segbar{display:flex;gap:2px;width:100%;max-width:120px;height:6px}
.segbar i{flex:1;background:var(--c);border-radius:1px}
.segbar i:first-child{border-radius:3px 1px 1px 3px}
.segbar i:last-child{border-radius:1px 3px 3px 1px}
.segbar i:only-child{border-radius:3px}
.new-dot{width:8px;height:8px;border-radius:50%;background:var(--s-progress);flex:none}
.tag{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;font:600 11px/1 var(--f-mono);background:var(--ink);color:var(--paper);flex:none}
.tag-none{background:transparent;color:var(--ink-3);border:1px dashed var(--rule-2)}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:12px}
.stat{flex:1 1 160px;min-width:0;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px 13px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
a.stat:hover{border-color:var(--rule-2);transform:translateY(-1px)}
.stat .lab{font-size:12.5px;color:var(--ink-2);font-weight:550;display:flex;align-items:center;gap:6px}
.stat .val{font-weight:750;font-size:30px;line-height:1;font-stretch:110%;letter-spacing:-.02em}
.stat .val small{font-size:15px;font-weight:600;margin-left:3px;letter-spacing:0}
.stat .ctx{font-size:12px;color:var(--ink-3)}
.stat.tone-late .lab .i{color:var(--s-late)}

/* panels + rows */
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);min-width:0;display:flex;flex-direction:column}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule);min-height:52px}
.panel-h h2{margin:0;font-size:14px;font-weight:750;font-stretch:112%;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1179px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row.nolead{grid-template-columns:minmax(0,1fr) auto}
a.row:hover{background:var(--sheet-2)}
.more-row .row-t{font-size:13px;color:var(--ink-2)}
.flip{transform:scaleX(-1)}
.row-main{min-width:0}
.row-t{font-weight:600;color:var(--ink);line-height:1.35}
.row-t:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2)}
.sub{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--ink-3);min-width:0}
.trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.quote{margin-top:6px;font-size:13px;color:var(--ink-2);border-left:2px solid var(--rule-2);padding-left:9px}
.row-act{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;justify-content:flex-end}
.row-act .segbar{width:96px;flex:none}
.row.leaving{animation:leave .22s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(14px)}}
@media (max-width:560px){.row{grid-template-columns:auto minmax(0,1fr)}.row-act{grid-column:2;justify-content:flex-start}.row.nolead{grid-template-columns:minmax(0,1fr)}.row.nolead .row-act{grid-column:1}}
.empty{padding:22px 16px;color:var(--ink-3);font-size:13.5px}
.empty.sm{padding:10px 0}
.acts{list-style:none;margin:0;padding:4px 0}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px 16px;align-items:start}
.act a{font-weight:600;color:var(--ink)}
.act a:hover{text-decoration:underline;text-underline-offset:3px}
.act time{font-size:11.5px;color:var(--ink-3);padding-top:3px}
.act .pill{height:22px;vertical-align:middle;margin-left:2px}
.act-q{margin-top:4px;font-size:13px;color:var(--ink-2)}
.kind{font:600 10px/1.6 var(--f-mono);text-transform:uppercase;letter-spacing:.07em;padding:0 6px;border-radius:4px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.kind.remark{background:var(--marker-wash);border-color:transparent;color:var(--ink)}
.rmks{list-style:none;margin:0;padding:0}
.rmk{padding:12px 16px;border-top:1px solid var(--rule)}
.rmk:first-child{border-top:0}
.rmk-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.rmk-h b{color:var(--ink);font-weight:650}
.rmk-h .new-dot{margin-left:auto}
.rmk-t{margin:6px 0 6px;font-size:14px}

/* cases list */

/* board */

.card-t{font-weight:600;font-size:13.5px;line-height:1.35}
.card-s{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-w{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-2);background:color-mix(in oklab,var(--s-wait) 9%,var(--sheet));border-radius:6px;padding:5px 7px}

.card-f{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:899px){.board{grid-template-columns:repeat(5,minmax(250px,80vw))}}
.hint{font-size:12.5px;color:var(--ink-3)}

/* case page */
.case-h{display:flex;flex-direction:column;gap:6px}

.pt{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);transition:border-color .2s,box-shadow .2s}

.pt-wait{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.pt-wait .i{color:var(--s-wait)}
.pt-meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:9px;align-items:center}

.review{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:color-mix(in oklab,var(--s-done) 8%,var(--sheet));border:1px solid color-mix(in oklab,var(--s-done) 26%,var(--sheet));font-size:13px}

.inp{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--rule-2);border-radius:8px;background:var(--sheet);font-size:14px;transition:border-color .15s,box-shadow .15s}

.drop:hover,.drop.over{border-color:var(--ink);background:color-mix(in oklab,var(--marker) 14%,var(--sheet))}

.peek{margin:12px 0 0;padding:12px 14px;border-radius:8px;background:var(--sheet-2);border:1px solid var(--rule);font:400 12px/1.6 var(--f-mono);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.add-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}

.reading{position:relative}

 if(!closed&&n<0)return{cls:"late",txt:`${-n}d overdue`,full:`Was due ${fmtD(d)}`,icon:"flag"};
 if(n===0)return{cls:closed?"":"soon",txt:"Today"};if(n===1)return{cls:closed?"":"soon",txt:"Tomorrow"};

 if(q)list=list.filter(c=>`${c.id} ${c.subject} ${c.from.name} ${c.from.org} ${c.points.map(p=>p.text).join(" ")}`.toLowerCase().includes(q));
 list=list.slice().sort((a,b)=>{const ca=caseClosed(a),cb=caseClosed(b);if(ca!==cb)return ca-cb;if(ca)return b.received.localeCompare(a.received);const na=a.points.filter(p=>!closedSt(p.status)&&p.due).sort(byDue)[0],nb=b.points.filter(p=>!closedSt(p.status)&&p.due).sort(byDue)[0];return byDue(na||{},nb||{})});
 const labels=[["open","Open"],["late","Overdue"],["review","Needs review"],["closed","Closed"],["all","All"]];
 return `<header class="ph"><div><h1 class="h1">Cases</h1><p class="lede">${lead?"Every email your team is working on. Each case holds the points pulled from one email.":"Every email you're working on. Each case holds the points pulled from one email."}</p></div><div class="ph-act">${viewSwitch("cases")}<a class="btn btn-primary" href="#add">${ico("plus","i-xs")}Add an email</a></div></header>

 <section class="panel" aria-label="Cases"><div class="crow h${lead?"":" nm"}" aria-hidden="true"><span class="c-id">ID</span><span>Email</span>${lead?'<span class="c-mem">Owner</span>':""}<span class="c-prog">Points approved</span><span class="c-due">Next deadline</span><span class="c-prio">Priority</span></div>${list.map(caseRow).join("")||`<div class="empty">No cases match. Try another filter, or add an email.</div>`}</section>`}

function card(p){const c=p.c,lead=S.role==="lead",canMove=!(S.role==="member"&&p.status==="approved");
 return `<article class="card" data-card="${p.id}" tabindex="0" draggable="${canMove}" aria-label="${esc(p.text)}, ${ST[p.status].l}"><div class="card-top"><span class="cid">${c.id} · ${p.src||"+"}</span>${c.priority==="high"?prio("high"):""}${canMove?`<button class="icon-btn" data-act="status-menu" data-id="${p.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Change status">${ico("more","i-xs")}</button>`:""}</div><div class="card-t">${esc(p.text)}</div>${p.status==="wait"&&p.wait?`<div class="card-w">${ico("clock","i-xs")}<span>${esc(p.wait)}</span></div>`:""}<div class="card-s">${esc(c.subject)}</div><div class="card-f">${lead?av(c.member,"av-xs"):"<span></span>"}${p.status==="approved"?`<span class="stamp sm">${ico("check","i-xs")}${(()=>{const e=[...p.log].reverse().find(x=>x.t==="status"&&x.to==="approved");return e?fmtS(D(e.at)):"Approved"})()}</span>`:due(p,{btn:false})}</div></article>`}
function vBoard(){const lead=S.role==="lead";let cs=vis();if(lead&&S.boardMember!=="all")cs=cs.filter(c=>c.member===S.boardMember);const ps=cs.flatMap(c=>c.points);
 const empty={todo:"Nothing waiting to start",progress:"Nothing in progress",wait:"Nothing is blocked",done:lead?"Nothing to review":"Nothing waiting for review",approved:"Nothing approved yet"};
 const cols=ORDER.map(s=>{let items=ps.filter(p=>p.status===s);if(s==="approved")items.sort((a,b)=>lastAt(b).localeCompare(lastAt(a)));else items.sort((a,b)=>(isLate(b)-isLate(a))||byDue(a,b));
  const shown=s==="approved"?items.slice(0,4):items;const more=items.length-shown.length;
  return `<section class="col st-${s}" data-col="${s}" aria-label="${ST[s].l}"><div class="col-h">${glyph(s)}<span>${s==="done"?"Done, needs review":ST[s].l}</span><span class="count">${items.length}</span></div><div class="col-b">${shown.map(card).join("")}${more>0?`<div class="more">and ${more} more</div>`:""}${items.length?"":`<div class="col-empty">${empty[s]}</div>`}</div></section>`}).join("");
 return `<header class="ph"><div><h1 class="h1">Board</h1><p class="lede">${lead?"Every open point across the team. Drag a card to change its status, or drop a Done card on Approved to sign it off.":`Your points by status. Drag a card to move it. When you mark a point done, ${LEAD.first} reviews it.`}</p></div><div class="ph-act">${viewSwitch("board")}</div></header>
 ${lead?`<div class="filters">${memberChips("boardMember",S.boardMember)}</div>`:""}
 <div class="board-wrap"><div class="board">${cols}</div></div><p class="hint">Tip: open a card's menu, or press Enter on it, if you'd rather not drag.</p>`}

 let t="",g=ico("dot","i-xs");
 if(e.t==="status"){g=glyph(e.to);t=e.to==="approved"?`<b>${esc(w.first)}</b> approved this point`:e.to==="wait"?`<b>${esc(w.first)}</b> set this to Waiting${e.reason?`: ${esc(e.reason)}`:""}`:`<b>${esc(w.first)}</b> moved this to ${ST[e.to].l}`}
 else if(e.t==="reopen"){g=ico("undo","i-xs");t=`<b>${esc(w.first)}</b> reopened this point`}
 else if(e.t==="due"){g=ico("cal","i-xs");t=e.to?`<b>${esc(w.first)}</b> set the deadline to ${fmtD(D(e.to))}`:`<b>${esc(w.first)}</b> removed the deadline`}

 return `<li class="sys"><span class="sys-g">${g}</span><div class="who">${t}<time>${fmtAt(e.at)}</time></div></li>`}

 return `<div class="review note">${glyph("done")}<span>Marked done. Waiting for ${LEAD.first} to approve it.</span></div>`}

 return `<li class="pt${open?" open":""}${p.status==="approved"?" is-approved":""}" id="pt-${p.id}"${p.src?` data-src-of="${p.src}"`:""}><div class="pt-row">${p.src?`<span class="tag">${p.src}</span>`:`<span class="tag tag-none" title="Added by hand">+</span>`}<div><button class="pt-text" data-act="toggle-pt" data-id="${p.id}" aria-expanded="${open}">${esc(p.text)}</button>${p.status==="wait"&&p.wait?`<div class="pt-wait">${ico("clock","i-xs")}<span>Waiting on: ${esc(p.wait)}</span></div>`:""}<div class="pt-meta">${pill(p)}${due(p)}${ups+rms?`<span class="pt-count">${ico("msg","i-xs")}${pl(ups,"update")}${rms?` · ${pl(rms,"remark")}`:""}</span>`:""}${approvedStamp(p)}</div></div><button class="pt-tog" data-act="toggle-pt" data-id="${p.id}" aria-expanded="${open}" aria-label="${open?"Hide":"Show"} updates">${ico("chevD")}</button></div>${open?`<div class="pt-body">${reviewBar(p,c)}${p.log.length?`<ol class="tl">${p.log.map(tlItem).join("")}</ol>`:`<p class="hint" style="margin:0">No updates yet.</p>`}${composer(p,c)}${p.src?`<button class="link-btn m-only" data-act="show-src" data-v="${p.src}">Show this in the email</button>`:""}</div>`:""}</li>`}

 return `${head}<div class="seg tabs-m" role="group" aria-label="Show"><button data-act="tab-m" data-v="email" aria-pressed="${S.tab==="email"}">${ico("mail","i-xs")}Email</button><button data-act="tab-m" data-v="points" aria-pressed="${S.tab==="points"}">Points<span class="n">${total}</span></button></div>

 ${S.addPt===c.id?`<form class="addpt" data-act-form="add-pt" data-id="${c.id}"><label class="sr" for="np-t">New point</label><input id="np-t" class="inp" placeholder="What needs to be done?" autocomplete="off"><label class="sr" for="np-d">Deadline</label><input id="np-d" type="date" class="inp"><button type="button" class="btn" data-act="cancel-addpt">Cancel</button><button class="btn btn-primary" type="submit">Add point</button></form>`:`<button class="add-pt" data-act="add-pt" data-id="${c.id}">${ico("plus","i-xs")}Add a point</button>`}</section></div>`}

/* ---------- charts ---------- */
const WK=["todo","progress","wait","done"];
function workData(){return activeMembers().map(m=>{const o={m,todo:0,progress:0,wait:0,done:0};S.cases.filter(c=>c.member===m.id).forEach(c=>c.points.forEach(p=>{if(p.status in o)o[p.status]++}));o.total=o.todo+o.progress+o.wait+o.done;return o})}
function workSvg(w){const data=workData(),narrow=w<400,labW=narrow?62:104,endW=30,rowH=40,barH=18;const maxT=Math.max(1,...data.map(d=>d.total));const sc=(w-labW-endW)/maxT;const h=data.length*rowH;
 let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Open points by member and status">`;
 data.forEach((d,i)=>{const y=i*rowH+(rowH-barH)/2,cy=i*rowH+rowH/2;s+=`<text x="0" y="${cy}" dominant-baseline="middle" class="t-lab">${esc(narrow?d.m.first:d.m.name)}</text>`;
  if(!d.total){s+=`<text x="${labW}" y="${cy}" dominant-baseline="middle" class="t-mut">No open points</text>`;return}
  let x=labW;const segs=WK.filter(k=>d[k]>0);
  segs.forEach((k,j)=>{const segW=d[k]*sc,last=j===segs.length-1,ww=Math.max(1,segW-(last?0:2));
   if(last){const r=Math.min(4,ww/2);s+=`<path d="M${x},${y}H${x+ww-r}Q${x+ww},${y} ${x+ww},${y+r}V${y+barH-r}Q${x+ww},${y+barH} ${x+ww-r},${y+barH}H${x}Z" class="st-${k} seg-f"/>`}
   else s+=`<rect x="${x}" y="${y}" width="${ww}" height="${barH}" class="st-${k} seg-f"/>`;
   s+=`<rect x="${x}" y="${y-8}" width="${segW}" height="${barH+16}" fill="transparent" class="st-${k}" data-tip="${esc(d.m.name)}|${k==="done"?"Done, needs review":ST[k].l}: ${pl(d[k],"point")}" data-c="${k}" tabindex="0" aria-label="${esc(d.m.name)}, ${ST[k].l}: ${d[k]}"/>`;x+=segW});
  s+=`<text x="${labW+d.total*sc+8}" y="${cy}" dominant-baseline="middle" class="t-val">${d.total}</text>`});
 return s+"</svg>"}
function weekData(){const mon=addDays(TODAY,-((TODAY.getDay()+6)%7));const cur=S.cases.filter(c=>c.received>=iso(mon)).length;const out=[];for(let i=7;i>=0;i--){const d=addDays(mon,-7*i);out.push({d,v:i?S.weekly[7-i]:cur,cur:!i})}return out}
function weekSvg(w){const data=weekData(),h=196,pl_=28,pr=6,pt=24,pb=28;const max=Math.max(4,Math.ceil(Math.max(...data.map(d=>d.v))/4)*4);const ph=h-pt-pb,pw=w-pl_-pr,band=pw/data.length,bw=Math.min(24,band*.52);const Y=v=>pt+ph-(v/max)*ph;
 let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="New cases per week, last 8 weeks">`;
 [0,max/2,max].forEach(t=>{const y=Y(t);s+=`<line x1="${pl_}" x2="${w-pr}" y1="${y}" y2="${y}" class="${t===0?"base":"gl"}"/><text x="${pl_-8}" y="${y}" text-anchor="end" dominant-baseline="middle" class="t-mut">${t}</text>`});
 data.forEach((d,i)=>{const cx=pl_+band*(i+.5),x0=cx-bw/2,x1=cx+bw/2,y=Y(d.v),yb=Y(0),r=Math.min(4,(yb-y)/2,bw/2);const lab=d.cur?"This week so far":`Week of ${fmtS(d.d)}`;
  if(d.v>0)s+=`<path d="M${x0},${yb}V${y+r}Q${x0},${y} ${x0+r},${y}H${x1-r}Q${x1},${y} ${x1},${y+r}V${yb}Z" class="${d.cur?"bar-cur":"bar-past"}"/>`;
  if(d.cur)s+=`<text x="${cx}" y="${y-8}" text-anchor="middle" class="t-val">${d.v}</text>`;
  if(band>=46||i%2===1)s+=`<text x="${cx}" y="${h-8}" text-anchor="middle" class="t-mut">${d.cur?"This wk":fmtS(d.d)}</text>`;
  s+=`<rect x="${cx-band/2}" y="${pt}" width="${band}" height="${ph}" fill="transparent" data-tip="${lab}|${pl(d.v,"new case")}" tabindex="0" aria-label="${lab}: ${pl(d.v,"new case")}"/>`});
 return s+"</svg>"}
function workTable(){return `<div class="tbl-wrap"><table class="dtable"><thead><tr><th>Member</th>${WK.map(k=>`<th class="n">${ST[k].l}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody>${workData().map(d=>`<tr><td>${esc(d.m.name)}</td>${WK.map(k=>`<td class="n">${d[k]}</td>`).join("")}<td class="n"><b>${d.total}</b></td></tr>`).join("")}</tbody></table></div>`}

 const done=(txt,note)=>{d.raw=txt;d.file={name,size:file.size,note};d.tab="upload";d.stage="input";d.parsed=null;if(!txt.trim()){d.file=null;toast("That file has no readable text. Paste the email instead.")}navigate("#add")};
 if(ext==="msg"){rd.onload=()=>done(readMsg(rd.result),"The preview reads plain text from .msg files");rd.readAsArrayBuffer(file)}
 else{rd.onload=()=>{const t=String(rd.result);done(ext==="eml"||(/^(received|return-path|mime-version|message-id):/im.test(t.slice(0,3000))&&/content-type:/i.test(t))?decodeEml(t):t,"Ready to read")};rd.readAsText(file)}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const t=e.target;
 if(menuEl&&!menuEl.contains(t)&&!(menuAnchor&&menuAnchor.contains(t)))closeMenu();
 if($("#pal")&&!t.closest(".pal")&&t.closest("#pal")){closePalette();return}
 const pi=t.closest("[data-pal]");if(pi){palGo(+pi.dataset.pal);return}
 const op=t.closest("[data-open]");if(op){const id=op.dataset.open;S.open.add(id);S.focusPt=id;clearRemarks(id);if(op.getAttribute("href")===location.hash){e.preventDefault();render()}return}
 const cardEl=t.closest(".card");if(cardEl&&!t.closest("button")){const p=findPt(cardEl.dataset.card);if(p){S.open.add(p.id);S.focusPt=p.id;S.tab="points";clearRemarks(p.id);navigate(caseHref(p.c))}return}
 const a=t.closest("[data-act]");if(!a)return;const act=a.dataset.act,id=a.dataset.id,v=a.dataset.v;
 switch(act){
  case"role":setRole(a.dataset.role);break;
  case"palette":openPalette();break;
  case"alerts":$("#drawer")?closeDrawer():openAlerts();break;
  case"close-layer":closeDrawer();break;
  case"close-menu":{const anc=menuAnchor;closeMenu();anc&&anc.focus();break}
  case"status-menu":{const p=findPt(id);if(!p)break;if(a.getAttribute("aria-disabled")==="true"){toast(`This point is approved. Ask ${LEAD.first} to reopen it if something changed.`);break}if(menuAnchor===a){closeMenu();break}openMenu(a,statusMenu(p));break}
  case"set-status":{const p=findPt(id);if(v==="wait"){menuEl.innerHTML=waitForm(p);placeMenu();$("#wr").focus();break}S.refocus=focusKey(menuAnchor);closeMenu();setStatus(id,v);break}
  case"due-menu":{if(menuAnchor===a){closeMenu();break}const tgt=a.dataset.case?`data-case="${a.dataset.case}"`:`data-id="${id}"`;const cur=a.dataset.case?findCase(a.dataset.case).deadline:findPt(id).due;openMenu(a,dueMenu(cur,tgt));break}
  case"set-due":S.refocus=focusKey(menuAnchor);closeMenu();setDue(a.dataset.case?{case:a.dataset.case}:{id},v);break;
  case"toggle-pt":S.open.has(id)?S.open.delete(id):(S.open.add(id),clearRemarks(id));render();break;
  case"approve":{const row=a.closest("[data-row]");if(row){row.classList.add("leaving");setTimeout(()=>setStatus(id,"approved"),RM.matches?0:200)}else setStatus(id,"approved");break}
  case"reopen":reopen(id);break;
  case"edit-case":S.editCase=id;render();$("#ec-t")&&$("#ec-t").focus();break;
  case"cancel-edit":S.editCase=null;render();break;
  case"prio-pick":{const g=document.getElementById(a.dataset.for);$$("button",g).forEach(b=>{b.setAttribute("aria-pressed",String(b===a));b.setAttribute("aria-checked",String(b===a))});if(a.dataset.for==="dp-prio"&&S.draft&&S.draft.parsed)S.draft.parsed.priority=v;break}
  case"add-pt":S.addPt=id;render();$("#np-t")&&$("#np-t").focus();break;
  case"cancel-addpt":S.addPt=null;render();break;
  case"filt":if(a.dataset.k==="cases")S.filt.cases=v;else if(a.dataset.k==="member")S.filt.member=v;else S.boardMember=v;render();break;
  case"chart-mode":S.chartMode[a.dataset.chart]=v;render();break;
  case"add-tab":S.draft.tab=v;render();break;
  case"pick-file":$("#file").click();break;
  case"sample":Object.assign(S.draft,{raw:SAMPLE,tab:"paste",file:null});render();$("#read-btn").focus();break;
  case"clear-file":Object.assign(S.draft,{raw:"",file:null});render();break;
  case"read":startRead();break;
  case"restart":readTimers.forEach(clearTimeout);S.draft=newDraft();render();break;
  case"dp-add":{const p=S.draft.parsed,key="n"+uid();p.points.push({key,src:null,text:"",due:""});render();const el=document.getElementById("dp-t-"+key);el&&el.focus();break}
  case"dp-del":{const p=S.draft.parsed;p.points=p.points.filter(x=>x.key!==id);render();break}
  case"create":createCase();break;
  case"team-add":S.teamForm=true;render();$("#nm-name").focus();break;
  case"team-cancel":S.teamForm=false;render();break;
  case"alert-open":{const al=alertsFor().find(x=>x.id===id);if(!al)break;al.unread=false;closeDrawer(false);if(al.pid){const p=findPt(al.pid);if(p){S.open.add(p.id);S.focusPt=p.id;S.tab="points";clearRemarks(p.id);navigate(caseHref(p.c));break}}if(al.cid){const c=findCase(al.cid);if(c){navigate(caseHref(c));break}}render();break}
  case"read-all":alertsFor().forEach(x=>x.unread=false);$("#drawer").innerHTML=drawerHtml();chrome(route());break;
  case"tab-m":S.tab=v;render();break;
  case"show-src":S.tab="email";render();setLit(v);{const m=$(`.case-mail .src[data-src="${v}"]`);m&&m.scrollIntoView({block:"center"})}setTimeout(()=>setLit(null),2000);break;
  case"src-click":{const c=findCase(route().id);if(!c)break;const p=c.points.find(x=>String(x.src)===v);if(p){S.open.add(p.id);S.focusPt=p.id;S.tab="points";render()}break}
 }});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-act-form]");if(!f)return;e.preventDefault();const id=f.dataset.id;
 switch(f.dataset.actForm){case"post":post(id,f);break;case"wait":{const r=$("#wr").value.trim();if(!r){$("#wr").focus();return}S.refocus=focusKey(menuAnchor);closeMenu();setStatus(id,"wait",{reason:r});break}case"save-case":saveCase(id);break;case"add-pt":addPoint(id);break;case"team-add":teamAdd();break}});
document.addEventListener("input",e=>{const t=e.target;
 if(t.matches(".comp textarea")){S.compose[t.closest("form").dataset.id]=t.value;return}
 if(t.id==="raw"){S.draft.raw=t.value;$("#read-btn").disabled=!t.value.trim();$("#raw-n").textContent=wordsMsg(t.value);return}
 if(t.id==="case-q"){S.filt.q=t.value;render();return}
 if(t.id==="pal-q"){PAL.q=t.value;PAL.sel=0;palRender();return}
 const p=S.draft&&S.draft.parsed;if(!p)return;
 if(t.id==="dp-title")p.subject=t.value;else if(t.id==="dp-summary")p.summary=t.value;else if(t.id==="dp-from")p.from.name=t.value;else if(t.id==="dp-org")p.from.org=t.value;else if(t.id==="dp-deadline")p.deadline=t.value;
 else if(t.dataset.dp){const x=p.points.find(y=>y.key===t.dataset.key);if(x)x[t.dataset.dp]=t.value}});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="file"&&t.files&&t.files[0]){S.draft=S.draft||newDraft();loadFile(t.files[0]);t.value=""}
 else if(t.id==="due-pick"&&t.value){S.refocus=focusKey(menuAnchor);closeMenu();setDue(t.dataset.case?{case:t.dataset.case}:{id:t.dataset.id},t.value)}
 else if(t.id==="dp-owner"&&S.draft&&S.draft.parsed)S.draft.parsed.owner=t.value});
document.addEventListener("keydown",e=>{const t=e.target,typing=t.matches&&t.matches("input,textarea,select,[contenteditable]");
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#pal")?closePalette():openPalette();return}
 if(PAL){if(e.key==="Escape"){e.preventDefault();closePalette();$("#search-btn").focus()}else if(e.key==="ArrowDown"){e.preventDefault();PAL.sel=Math.min(PAL.items.length-1,PAL.sel+1);palRender()}else if(e.key==="ArrowUp"){e.preventDefault();PAL.sel=Math.max(0,PAL.sel-1);palRender()}else if(e.key==="Enter"){e.preventDefault();palGo(PAL.sel)}else if(e.key==="Tab")e.preventDefault();return}
 if(e.key==="Escape"){if(menuEl){const anc=menuAnchor;closeMenu();anc&&anc.focus();return}if($("#drawer")){closeDrawer();return}if(S.editCase){S.editCase=null;render();return}if(S.addPt){S.addPt=null;render()}return}
 if(menuEl&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&!typing){const items=$$(".mi:not([disabled])",menuEl);const i=items.indexOf(document.activeElement);e.preventDefault();const n=e.key==="ArrowDown"?(i+1)%items.length:(i-1+items.length)%items.length;items[n]&&items[n].focus();return}
 if(t.matches&&t.matches(".comp textarea")&&(e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();t.form.requestSubmit();return}
 if(t.matches&&t.matches('.card,[role="button"]')&&(e.key==="Enter"||e.key===" ")){e.preventDefault();t.click();return}
 if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
 const k=e.key.toLowerCase(),map={o:"#overview",c:"#cases",b:"#board",n:"#add"};
 if(k==="/"){e.preventDefault();openPalette()}else if(map[k]){e.preventDefault();navigate(map[k])}else if(k==="t"&&S.role==="lead")navigate("#team");else if(k==="a")openAlerts()});
/* drag + drop: board cards and email files */
const hasFiles=e=>!!e.dataTransfer&&[...e.dataTransfer.types].includes("Files");
document.addEventListener("dragstart",e=>{const c=e.target.closest&&e.target.closest('.card[draggable="true"]');if(!c)return;S.drag=c.dataset.card;e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",S.drag);requestAnimationFrame(()=>c.classList.add("dragging"))});
document.addEventListener("dragend",()=>{$$(".card.dragging").forEach(c=>c.classList.remove("dragging"));$$(".col.over,.col.nodrop").forEach(c=>c.classList.remove("over","nodrop"));S.drag=null});
document.addEventListener("dragover",e=>{if(S.drag){const col=e.target.closest&&e.target.closest(".col");$$(".col.over,.col.nodrop").forEach(c=>c!==col&&c.classList.remove("over","nodrop"));if(!col)return;if(S.role==="member"&&col.dataset.col==="approved"){col.classList.add("nodrop");return}e.preventDefault();e.dataTransfer.dropEffect="move";col.classList.add("over");return}
 if(hasFiles(e)){e.preventDefault();document.body.classList.add("filedrag")}});
document.addEventListener("dragleave",e=>{if(hasFiles(e)&&(e.clientX<=0||e.clientY<=0||e.clientX>=innerWidth||e.clientY>=innerHeight))document.body.classList.remove("filedrag")});
document.addEventListener("drop",e=>{if(S.drag){const col=e.target.closest&&e.target.closest(".col");if(!col)return;e.preventDefault();const to=col.dataset.col,id=S.drag;col.classList.remove("over");const p=findPt(id);if(!p||p.status===to)return;
  if(to==="wait"){const anchor=col.querySelector(".col-h");openMenu(anchor,waitForm(p))}else setStatus(id,to);return}
 if(hasFiles(e)){e.preventDefault();document.body.classList.remove("filedrag");const f=e.dataTransfer.files[0];if(f){readTimers.forEach(clearTimeout);S.draft=newDraft();loadFile(f)}}});
addEventListener("hashchange",()=>{closeAll();readTimers.forEach(clearTimeout);if(S.draft)S.draft.running=false;S.editCase=null;S.addPt=null;render({enter:true})});

render({enter:true});
})();
</script>
