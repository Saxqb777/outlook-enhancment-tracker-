<title>Agthia Enhancements</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one floating glass app over a softly blurred office. A glass top bar carries the tabs; each page is a stack of frosted panels with open gaps so the room shows through. Light only, by choice. */
:root{
  color-scheme:light;
  --bg:#E7E9EC;
  --ink:#11161F;--ink-2:#394151;--ink-3:#5A6273;--ink-4:#868D9B;
  --glass:rgba(255,255,255,.58);--glass-2:rgba(255,255,255,.76);--glass-3:rgba(255,255,255,.9);
  --edge:rgba(255,255,255,.75);--hair:rgba(17,22,31,.08);--hair-2:rgba(17,22,31,.14);--wash:rgba(17,22,31,.05);
  --accent:#2F5BEA;--focus:#2F5BEA;--marker-wash:rgba(255,206,0,.42);
  --s-todo:#8A91A5;--s-progress:#2F5BEA;--s-wait:#B97A0B;--s-done:#12936A;--s-approved:#11161F;--s-late:#D03B3B;
  --bar-past:#C3CAD6;--btn:#11161F;--btn-ink:#FFFFFF;
  --toast:rgba(17,22,31,.9);--toast-ink:#FFFFFF;--toast-act:#A9C0FF;
  --scrim:rgba(14,19,29,.34);
  --blur:saturate(1.7) blur(22px);
  --sh-1:0 1px 1px rgba(17,22,31,.03),0 10px 30px -10px rgba(17,22,31,.16);
  --sh-2:0 2px 6px rgba(17,22,31,.06),0 28px 64px -16px rgba(17,22,31,.32);
  --f:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;--r-2:12px;--r-3:9px;--top-h:64px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:45;background:rgba(243,244,246,.85)}
::selection{background:var(--marker-wash)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.page:focus{outline:none}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i-xs{width:15px;height:15px}
.cid{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
time{font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
kbd{font:600 11px/1 var(--f);color:var(--ink-3);background:var(--wash);border-radius:5px;padding:3px 6px}
q{quotes:"\201C" "\201D"}
.st-todo{--c:var(--s-todo)}.st-progress{--c:var(--s-progress)}.st-wait{--c:var(--s-wait)}.st-done{--c:var(--s-done)}.st-approved{--c:var(--s-approved)}.st-late{--c:var(--s-late)}
.sg{width:15px;height:15px;color:var(--c);flex:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--s-late);flex:none}

/* scene */
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;transform:scale(1.05);pointer-events:none;display:block}
#scene.soft{filter:blur(6px)}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(243,244,246,.62),rgba(243,244,246,.4) 45%,rgba(243,244,246,.56))}
.shell{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.shell{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}

/* glass */
.top,.panel,.stat,.mail,.pt,.col,.pv,.bnav,.find,.help-btn{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--sh-1)}
.menu,.drawer,.pal,.tour-card,.launch,.tip{background:var(--glass-3);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);box-shadow:var(--sh-2)}
.mail{background:var(--glass-2)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.top,.panel,.stat,.mail,.pt,.col,.pv,.bnav,.find,.help-btn,.menu,.drawer,.pal,.tour-card,.launch,.tip{background:rgba(255,255,255,.93)}}

/* top bar */
.top{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));z-index:40;max-width:1260px;margin:12px auto 0;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 10px 0 16px;border-radius:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.02em;flex:none}
.logo{width:26px;height:26px;flex:none}
.tabs{position:relative;display:flex;padding:4px;border-radius:14px;background:var(--wash);margin:0 auto}
.tab-links{display:flex;gap:2px}
.tabs a{position:relative;z-index:1;height:36px;padding:0 18px;display:inline-flex;align-items:center;border-radius:10px;font-weight:550;color:var(--ink-3);transition:color .25s}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
.tab-thumb{position:absolute;z-index:0;top:4px;left:0;width:0;height:36px;border-radius:10px;background:var(--glass-3);box-shadow:0 1px 2px rgba(17,22,31,.08),0 6px 16px -6px rgba(17,22,31,.18);transition:transform .45s var(--ease),width .45s var(--ease),opacity .25s}
.top-r{display:flex;align-items:center;gap:8px;flex:none}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 12px;border-radius:11px;color:var(--ink-3);font-size:13.5px;background:var(--wash);transition:background .2s,color .2s}
.search:hover{background:rgba(17,22,31,.08);color:var(--ink)}
.icon-btn{position:relative;width:38px;height:38px;display:inline-grid;place-items:center;border-radius:11px;color:var(--ink-2);flex:none;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--wash);color:var(--ink)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--s-late);color:#fff;font:700 10px/17px var(--f);text-align:center;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:12px}
.me-t{display:flex;flex-direction:column;line-height:1.25}
.me-t b{font-size:13px;font-weight:600}
.me-t span{font-size:11.5px;color:var(--ink-3)}
@media (max-width:1240px){.me-t{display:none}}
@media (max-width:1060px){.search span,.search kbd{display:none}.search{padding:0;width:38px;justify-content:center}}

/* preview chip */
.pv{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 14px;border-radius:15px;font-size:12.5px;color:var(--ink-3)}
.pv b{color:var(--ink);font-weight:650}

/* page */
.page{max-width:1260px;margin:0 auto;padding-block:30px calc(110px + env(safe-area-inset-bottom,0px))}
.page-in{display:flex;flex-direction:column;gap:18px}
.page-in.enter>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;padding:4px 4px 6px}
.ph>div:first-child{min-width:0;flex:1 1 360px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.date{font-size:13px;font-weight:550;color:var(--ink-3)}
.h1{margin:4px 0 0;font-weight:700;font-size:clamp(25px,2.6vw,32px);line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
.lede{margin:8px 0 0;max-width:66ch;color:var(--ink-2);font-size:15px;line-height:1.55}
.lede b{color:var(--ink);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-3);transition:color .2s}
.back:hover{color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:11px;font-weight:600;font-size:13.5px;background:rgba(255,255,255,.78);color:var(--ink);border:1px solid var(--hair);box-shadow:0 1px 2px rgba(17,22,31,.05);white-space:nowrap;transition:background .2s,box-shadow .2s,transform .12s,border-color .2s}
.btn:hover{background:#fff;box-shadow:0 4px 14px -6px rgba(17,22,31,.22)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn-primary:hover{background:#1F2633;box-shadow:0 6px 18px -6px rgba(17,22,31,.45)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--wash);box-shadow:none}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:9px;gap:5px}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.link-btn{font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}

/* segmented + chips */
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--wash);gap:2px;flex-wrap:wrap}
.seg button,.seg a{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:550;color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .25s,color .2s,box-shadow .25s}
.seg button:hover,.seg a:hover{color:var(--ink)}
.seg [aria-pressed="true"],.seg [aria-current="page"]{background:var(--glass-3);color:var(--ink);box-shadow:0 1px 2px rgba(17,22,31,.08),0 4px 12px -6px rgba(17,22,31,.18)}
.seg .n{font-size:11.5px;font-weight:600;color:var(--ink-4);font-variant-numeric:tabular-nums}
.seg-pv button{height:28px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px 0 6px;border-radius:12px;font-size:13px;font-weight:550;color:var(--ink-2);display:inline-flex;align-items:center;gap:8px;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);transition:background .2s,color .2s}
.chip.all{padding-left:14px}
.chip:hover{background:var(--glass-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip[aria-pressed="true"] .av{background:rgba(255,255,255,.18);color:#fff}

/* people, status, dates */
.av{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;font:650 10.5px/1 var(--f);letter-spacing:.02em;background:rgba(17,22,31,.07);color:var(--ink-2);flex:none}
.av.lead{background:var(--ink);color:#fff}
.av-xs{width:22px;height:22px;font-size:9px;border-radius:6px}
.av-md{width:34px;height:34px;font-size:11.5px;border-radius:10px}
.av-lg{width:56px;height:56px;font-size:17px;border-radius:15px}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .2s}
button.pill:hover{background:var(--wash)}
.pill .i{width:13px;height:13px;color:var(--ink-4);opacity:0;margin-left:-2px;transition:opacity .2s}
button.pill:hover .i,button.pill:focus-visible .i{opacity:1}
@media (hover:none){.pill .i{opacity:.8}}
.due{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .2s}
button.due:hover{background:var(--wash);color:var(--ink)}
.due .i{width:14px;height:14px;color:var(--ink-4)}
.due.soon{color:var(--ink);font-weight:600}
.due.late{color:var(--ink);font-weight:600}
.due.late .i{color:var(--s-late)}
.due.none{color:var(--ink-4)}
.prio{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.prio svg{width:12px;height:12px;color:var(--ink)}
.prio-high{color:var(--ink);font-weight:600}
.count{font-size:13px;font-weight:600;color:var(--ink-4);font-variant-numeric:tabular-nums}
.stamp{display:inline-flex;align-items:center;gap:6px;font:700 10.5px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;color:var(--ink);border:1.5px solid var(--ink);border-radius:5px;padding:4px 7px;transform:rotate(-2deg);white-space:nowrap}
.stamp.sm{font-size:10px;padding:3px 6px}
.stamp.fresh{animation:stamp .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp{from{opacity:0;transform:scale(1.7) rotate(-9deg)}to{opacity:1;transform:scale(1) rotate(-2deg)}}
.segbar{display:flex;gap:2px;width:100%;max-width:120px;height:6px}
.segbar i{flex:1;background:var(--c);border-radius:1px;transition:background .3s}
.segbar i:first-child{border-radius:3px 1px 1px 3px}.segbar i:last-child{border-radius:1px 3px 3px 1px}.segbar i:only-child{border-radius:3px}
.new-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.tag{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:7px;font:700 11.5px/1 var(--f);background:var(--ink);color:#fff;flex:none;font-variant-numeric:tabular-nums}
.tag-none{background:transparent;color:var(--ink-4);border:1px dashed var(--hair-2)}

/* stats */
.stats{display:flex;flex-wrap:wrap;gap:14px}
.stat{flex:1 1 200px;min-width:0;border-radius:var(--r);padding:16px 18px 15px;display:flex;flex-direction:column;gap:8px;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .25s}
a.stat:hover{transform:translateY(-3px);background:var(--glass-2);box-shadow:var(--sh-2)}
.stat .lab{font-size:13px;color:var(--ink-2);font-weight:550;display:flex;align-items:center;gap:7px}
.stat .val{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.035em}
.stat .val small{font-size:16px;font-weight:600;margin-left:3px;letter-spacing:0;color:var(--ink-2)}
.stat .ctx{font-size:12.5px;color:var(--ink-3)}
@media (max-width:560px){.stats{gap:10px}.stat{flex:1 1 calc(50% - 5px);padding:14px 14px 13px}.stat .val{font-size:28px}.stat .lab{font-size:12.5px}}

/* panels + rows */
.panel{border-radius:var(--r);min-width:0;display:flex;flex-direction:column;overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;flex-wrap:wrap;padding:14px 18px 12px;min-height:56px}
.panel-h h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1179px){.grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}}
.rows{display:flex;flex-direction:column;padding:0 8px 8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:11px 10px;border-radius:12px;transition:background .2s}
.row+.row{box-shadow:0 -1px 0 var(--hair)}
.row:hover{background:rgba(255,255,255,.55)}
.row.nolead{grid-template-columns:minmax(0,1fr) auto}
.row-main{min-width:0}
.row-t{font-weight:600;color:var(--ink);line-height:1.38}
a.row-t:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair-2)}
.sub{display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--ink-3);min-width:0}
.trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.quote{margin-top:7px;font-size:13px;color:var(--ink-2);padding-left:10px;box-shadow:inset 2px 0 0 var(--hair-2)}
.row-act{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap;justify-content:flex-end}
.row-act .segbar{width:96px;flex:none}
.more-row .row-t{font-size:13px;color:var(--ink-3)}
.flip{transform:scaleX(-1)}
.row.leaving{animation:leave .3s var(--ease) forwards}
@keyframes leave{to{opacity:0;transform:translateX(18px)}}
@media (max-width:560px){.row{grid-template-columns:auto minmax(0,1fr)}.row-act{grid-column:2;justify-content:flex-start}.row.nolead{grid-template-columns:minmax(0,1fr)}.row.nolead .row-act{grid-column:1}}
.empty{padding:8px 18px 22px;color:var(--ink-3);font-size:13.5px}
.empty.sm{padding:10px 0}
.acts{list-style:none;margin:0;padding:0 8px 8px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:10px;align-items:start;border-radius:12px}
.act+.act{box-shadow:0 -1px 0 var(--hair)}
.act a{font-weight:600;color:var(--ink)}
.act a:hover{text-decoration:underline;text-underline-offset:3px}
.act time{font-size:12px;color:var(--ink-4);padding-top:4px}
.act .pill{height:24px;padding:0 6px;vertical-align:middle;background:rgba(255,255,255,.6)}
.act-q{margin-top:4px;font-size:13px;color:var(--ink-2)}
.kind{font:700 10px/1.7 var(--f);text-transform:uppercase;letter-spacing:.08em;padding:0 6px;border-radius:5px;background:var(--wash);color:var(--ink-3);white-space:nowrap}
.kind.remark{background:var(--marker-wash);color:var(--ink)}
.rmks{list-style:none;margin:0;padding:0 8px 8px}
.rmk{padding:12px 10px;border-radius:12px}
.rmk+.rmk{box-shadow:0 -1px 0 var(--hair)}
.rmk-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.rmk-h b{color:var(--ink);font-weight:600}
.rmk-h .new-dot{margin-left:auto}
.rmk-t{margin:7px 0;font-size:14px;line-height:1.5}
.rmk-on{font-size:12.5px;color:var(--ink-3);display:inline-flex;gap:8px;flex-wrap:wrap;transition:color .2s}
.rmk-on:hover{color:var(--ink)}

/* charts */
.chart{padding:6px 18px 16px;min-height:60px}
.chart svg{display:block;overflow:visible;max-width:100%;font:500 11.5px var(--f)}
.t-lab{fill:var(--ink-2);font-weight:550;font-size:12.5px}
.t-mut{fill:var(--ink-3)}
.t-val{fill:var(--ink);font-weight:700;font-size:12.5px}
.gl{stroke:var(--hair)}.base{stroke:var(--hair-2)}
.seg-f{fill:var(--c)}
.bar-past{fill:var(--bar-past)}.bar-cur{fill:var(--accent)}
[data-tip]:focus{outline:none}
[data-tip]:focus-visible{outline:2px solid var(--focus)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink-2);padding:0 18px 4px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.tbl-wrap{overflow-x:auto;padding:0 8px 10px}
.dtable{width:100%;border-collapse:collapse;font-size:13px}
.dtable th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:left;padding:8px 10px}
.dtable td{padding:9px 10px;border-top:1px solid var(--hair)}
.dtable .n{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:95;pointer-events:none;border-radius:11px;padding:9px 11px;font-size:12.5px;line-height:1.45;max-width:240px;display:flex;flex-direction:column;color:var(--ink)}
.tip b{font-weight:650}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:6px}

/* cases list */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.find{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:12px;color:var(--ink-3);flex:1 1 220px;max-width:360px;transition:background .2s,box-shadow .2s}
.find input{border:0;background:transparent;outline:none;min-width:0;flex:1;color:var(--ink);font-size:13.5px}
.find:focus-within{background:var(--glass-3);box-shadow:0 0 0 3px rgba(47,91,234,.18)}
.list{padding:4px 8px 8px}
.crow{display:grid;grid-template-columns:72px minmax(0,1fr) 96px 140px 124px 78px;gap:16px;align-items:center;padding:12px 10px;border-radius:12px;transition:background .2s}
.crow.nm{grid-template-columns:72px minmax(0,1fr) 140px 124px 78px}
.crow+.crow{box-shadow:0 -1px 0 var(--hair)}
a.crow:hover{background:rgba(255,255,255,.6)}
.crow.h{padding-block:8px 6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.crow.h:hover{background:none}
.c-main{display:flex;flex-direction:column;min-width:0}
.c-subj{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-from{font-size:12.5px;color:var(--ink-3);display:flex;gap:8px;min-width:0}
.cid-m{display:none}
.c-mem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.c-prog{display:flex;align-items:center;gap:10px}
@media (max-width:1179px){
  .crow{grid-template-columns:minmax(0,1fr) 96px 140px 124px}.crow.nm{grid-template-columns:minmax(0,1fr) 140px 124px}
  .crow .c-id,.crow .c-prio{display:none}.cid-m{display:inline}
}
@media (max-width:699px){
  .crow,.crow.nm{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"main due" "prog prog";row-gap:10px}
  .crow.h,.crow .c-mem{display:none}
  .c-main{grid-area:main}.c-due{grid-area:due}.c-prog{grid-area:prog}
}

/* board */
.board-wrap{overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity}
.board{display:grid;grid-template-columns:repeat(5,minmax(196px,1fr));gap:14px;min-width:min-content}
.col{border-radius:var(--r);display:flex;flex-direction:column;min-height:240px;scroll-snap-align:start;background:rgba(255,255,255,.4);transition:background .25s,box-shadow .25s}
.col-h{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;font-weight:650;font-size:13.5px}
.col-h .count{margin-left:auto}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;flex:1}
.col.over{background:rgba(255,255,255,.66);box-shadow:var(--sh-1),inset 0 0 0 2px var(--c)}
.col.nodrop{opacity:.5}
.col-empty{font-size:12.5px;color:var(--ink-4);padding:18px 8px;text-align:center;border:1px dashed var(--hair-2);border-radius:12px}
.more{font-size:12.5px;color:var(--ink-3);padding:4px 8px}
.card{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.85);border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:0 1px 2px rgba(17,22,31,.05);transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .2s}
.card[draggable="true"]{cursor:grab}
.card:hover{background:rgba(255,255,255,.92);transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(17,22,31,.3)}
.card.dragging{opacity:.4;transform:rotate(2deg) scale(.98)}
.card-top{display:flex;align-items:center;gap:8px}
.card-top .icon-btn{margin-left:auto;width:28px;height:28px;border-radius:8px}
.card-t{font-weight:600;font-size:13.5px;line-height:1.38}
.card-s{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-w{display:flex;gap:6px;align-items:flex-start;font-size:12px;color:var(--ink-2);background:rgba(185,122,11,.08);border-radius:8px;padding:6px 8px}
.card-w .i{color:var(--s-wait);margin-top:1px}
.card-f{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.card-f .due{height:24px;padding:0 4px}
@media (max-width:899px){.board{grid-template-columns:repeat(5,minmax(250px,80vw))}}
.hint{font-size:12.5px;color:var(--ink-3)}

/* case page */
.case-h{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
.case-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.case-top .sp{flex:1}
.cid.big{font-size:13px}
.case-meta{display:flex;flex-wrap:wrap;gap:12px 30px;margin:14px 0 0;padding:14px 18px;border-radius:var(--r);background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.6)}
.case-meta>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.case-meta dt{font-size:12px;font-weight:600;color:var(--ink-3)}
.case-meta dd{margin:0;display:flex;align-items:center;gap:8px;font-size:13.5px;min-height:30px}
.case-meta .segbar{width:90px}
.case-meta .due{margin-left:-8px}
.tabs-m{display:none;align-self:flex-start}
.case-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;align-items:start}
.case-mail{position:sticky;top:calc(var(--top-h) + 28px + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--top-h) - 48px);overflow:auto;border-radius:var(--r)}
.pts-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 4px 10px}
.pts-h h2{margin:0;font-size:15px;font-weight:650;display:flex;gap:8px;align-items:baseline}
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pt{border-radius:16px;transition:box-shadow .3s var(--ease),background .3s,transform .3s var(--ease)}
.pt.lit{background:var(--glass-2);box-shadow:var(--sh-1),0 0 0 2px rgba(245,190,0,.75)}
.pt.is-approved .pt-text{color:var(--ink-2)}
.pt-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:14px 12px 12px 16px;align-items:start}
.pt-row .tag{margin-top:1px}
.pt-text{font-weight:600;font-size:14.5px;line-height:1.4;color:var(--ink);text-align:left;display:block}
.pt-wait{display:flex;gap:6px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--ink-2)}
.pt-wait .i{color:var(--s-wait)}
.pt-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin:8px 0 0 -8px;align-items:center}
.pt-count{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3);margin-left:6px}
.pt-tog{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3);transition:background .2s,color .2s}
.pt-tog:hover{background:var(--wash);color:var(--ink)}
.pt-tog .i{transition:transform .35s var(--ease)}
.pt.open .pt-tog .i{transform:rotate(180deg)}
.pt-body{padding:4px 18px 18px 50px;display:flex;flex-direction:column;gap:14px;animation:rise .4s var(--ease)}
@media (max-width:560px){.pt-body{padding-left:16px}}
.review{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:rgba(18,147,106,.08);font-size:13px}
.review .sp{flex:1}
.review.note{background:var(--wash);color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.tl li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.tl .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);min-height:28px}
.tl .who b{color:var(--ink);font-weight:600}
.tl time{font-size:12px;color:var(--ink-4)}
.tl .txt{margin-top:2px;font-size:14px;line-height:1.55}
.tl li.sys{align-items:center}
.tl li.sys .who{min-height:0}
.sys-g{display:grid;place-items:center;width:28px;color:var(--ink-4)}
.comp{display:flex;flex-direction:column;gap:8px}
.comp-f{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.add-pt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:10px;border:1.5px dashed rgba(17,22,31,.16);border-radius:16px;color:var(--ink-2);font-weight:600;font-size:13px;background:rgba(255,255,255,.28);transition:background .2s,border-color .2s,color .2s}
.add-pt:hover{border-color:rgba(17,22,31,.3);color:var(--ink);background:rgba(255,255,255,.55)}
.addpt{display:grid;grid-template-columns:minmax(0,1fr) 160px auto auto;gap:8px;margin-top:10px;padding:10px;border-radius:16px;background:var(--glass-2);border:1px solid var(--edge)}
@media (max-width:640px){.addpt{grid-template-columns:minmax(0,1fr) auto}.addpt .inp:first-of-type{grid-column:1/-1}}
.m-only{display:none}
@media (max-width:1179px){
  .tabs-m{display:inline-flex}
  .case-grid{grid-template-columns:minmax(0,1fr)}
  .case-mail{position:static;max-height:none}
  .case-grid[data-tab="points"] .case-mail,.case-grid[data-tab="email"] .case-pts{display:none}
  .d-only{display:none}
  .m-only{display:inline-flex}
}

/* email */
.mail{border-radius:var(--r);overflow:hidden;position:relative}
.mail-h{padding:18px 22px 14px;border-bottom:1px solid var(--hair)}
.mail-s{font-weight:650;font-size:16px;margin-bottom:10px;line-height:1.35;letter-spacing:-.01em}
.mail-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 14px;margin:0;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.mail-meta dt{color:var(--ink-4);font-weight:500}
.mail-meta dd{margin:0;overflow-wrap:anywhere}
.mail-b{padding:18px 22px 22px;font-size:14.5px;line-height:1.72;max-width:70ch}
.mail-b p{margin:0 0 12px;white-space:pre-line}
.mail-b p:last-child{margin-bottom:0}
.src{background:linear-gradient(var(--marker-wash),var(--marker-wash)) no-repeat 0 88%/0% 72%;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .55s var(--ease);border-bottom:1.5px dotted rgba(17,22,31,.22);padding:1px 2px;cursor:pointer;border-radius:3px}
.src.lit{background-size:100% 72%;border-bottom-color:transparent}
.src .tag{min-width:18px;height:18px;font-size:10.5px;margin-right:5px;vertical-align:1px;display:inline-grid;border-radius:5px}

/* add flow */
.add-card{max-width:880px}
.add-b{padding:0 18px 16px}
.add-f{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--hair)}
.inp{width:100%;min-height:40px;padding:9px 12px;border:1px solid var(--hair-2);border-radius:11px;background:rgba(255,255,255,.78);font-size:14px;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:hover{background:rgba(255,255,255,.92)}
.inp:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,91,234,.16)}
.inp-lg{font-size:16px;font-weight:600}
.inp-date{width:auto}
textarea.inp{resize:vertical;line-height:1.5}
.raw{min-height:300px;font-size:13.5px;line-height:1.65}
.comp textarea{min-height:66px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:250px;padding:28px 20px;text-align:center;border:1.5px dashed rgba(17,22,31,.18);border-radius:16px;background:rgba(255,255,255,.35);color:var(--ink-2);transition:border-color .25s,background .25s,transform .25s var(--ease)}
.drop:hover,.drop.over{border-color:var(--accent);background:rgba(255,255,255,.7)}
.drop .i{width:30px;height:30px;color:var(--ink);margin-bottom:4px}
.drop b{font-size:15.5px;color:var(--ink)}
.drop span{font-size:13px}
.filechip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.6)}
.filechip>div{flex:1;min-width:0;display:flex;flex-direction:column}
.filechip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.filechip span{font-size:12.5px;color:var(--ink-3)}
.peek{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.5);font:400 12.5px/1.6 var(--f);color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
.add-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.sticky-col{position:sticky;top:calc(var(--top-h) + 28px + env(safe-area-inset-top,0px))}
@media (max-width:1179px){.add-grid{grid-template-columns:minmax(0,1fr)}.sticky-col{position:static}.sticky-col .mail-b{max-height:280px;overflow:auto}}
.reading{position:relative}
.reading .mail::after{content:"";position:absolute;left:0;right:0;top:0;height:80px;pointer-events:none;background:linear-gradient(to bottom,rgba(47,91,234,0),rgba(47,91,234,.08));border-bottom:2px solid rgba(47,91,234,.55);animation:scan 1.6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes scan{from{top:0}to{top:calc(100% - 80px)}}
.read-steps ol{list-style:none;margin:0;padding:4px 8px 8px}
.read-steps li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 10px;border-radius:12px;color:var(--ink-4);transition:color .3s}
.read-steps li+li{box-shadow:0 -1px 0 var(--hair)}
.read-steps li.ok{color:var(--ink)}
.rs-g{position:relative;width:18px;height:18px}
.rs-g svg{position:absolute;inset:0;width:18px;height:18px;transition:opacity .25s,transform .35s var(--ease)}
.spin{animation:spin .8s linear infinite;color:var(--ink-4)}
@keyframes spin{to{transform:rotate(360deg)}}
.rs-g .ck{opacity:0;transform:scale(.5);color:var(--s-done);stroke-width:2.4}
li.ok .spin{opacity:0}
li.ok .ck{opacity:1;transform:none}
.rs-v{font-size:13px;font-weight:600;color:var(--ink-2);opacity:0;transform:translateX(-4px);transition:opacity .3s,transform .35s var(--ease)}
li.ok .rs-v,.rs-v.live{opacity:1;transform:none}
.rev-form .rf{padding:4px 18px 18px;display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.flabel-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fields-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--hair)}
.pe-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pe{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"tag text del" ". due .";gap:6px 8px;align-items:center;padding:8px;border-radius:13px;background:rgba(255,255,255,.35);transition:background .25s,box-shadow .25s}
.pe.lit{background:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(245,190,0,.7)}
.pe .tag{grid-area:tag}.pe [data-dp="text"]{grid-area:text}.pe [data-dp="due"]{grid-area:due;justify-self:start;min-height:34px;padding-block:5px;font-size:13px}.pe .icon-btn{grid-area:del}
.found{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.found li{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2)}
.found .due{height:24px;padding:0;flex:none}
.err{font-size:12.5px;color:var(--s-late);font-weight:550}

/* team */
.trow{display:grid;grid-template-columns:minmax(0,2fr) 70px 70px 84px minmax(130px,1fr) 104px;gap:14px;align-items:center;padding:12px 10px;border-radius:12px;transition:background .2s}
.trow+.trow{box-shadow:0 -1px 0 var(--hair)}
a.trow:hover{background:rgba(255,255,255,.6)}
.trow.h{padding-block:8px 6px;font-size:12px;font-weight:600;color:var(--ink-3)}
.t-who{display:flex;align-items:center;gap:12px;min-width:0}
.t-who>span{display:flex;flex-direction:column;min-width:0}
.t-who b{font-weight:600}
.t-who .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.late-n{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tag-st{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:8px;font-size:12px;font-weight:600;background:var(--wash);color:var(--ink-2)}
.tag-st.inv{background:transparent;box-shadow:inset 0 0 0 1px var(--hair-2)}
.tag-st.lead{background:var(--ink);color:#fff}
.meter-w{display:flex;align-items:center;gap:10px}
.meter{flex:1;max-width:110px;height:6px;border-radius:3px;background:rgba(18,147,106,.16);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--s-done)}
.meter.below{background:rgba(185,122,11,.16)}
.meter.below i{background:var(--s-wait)}
@media (max-width:1179px){.trow{grid-template-columns:minmax(0,1fr) 56px 60px 76px 96px}.trow .t-on{display:none}}
@media (max-width:699px){.trow{grid-template-columns:minmax(0,1fr) auto;row-gap:8px}.trow.h{display:none}.trow .t-n{display:none}}
.team-form .tf-b{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:0 18px 4px}
.tf-note{margin:10px 18px 12px}
.who-h{display:flex;align-items:center;gap:16px;margin-top:10px}

/* floating layers */
.menu{position:fixed;z-index:80;min-width:236px;max-width:calc(100vw - 24px);border-radius:14px;padding:6px;animation:pop .18s var(--ease);transform-origin:top left}
.menu-h{font-size:12px;font-weight:600;color:var(--ink-3);padding:7px 10px 5px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:550;transition:background .15s}
.mi:hover,.mi:focus-visible{background:var(--wash);outline:none}
.mi[disabled]{opacity:.45;cursor:not-allowed;background:none}
.mi .hint{margin-left:auto;font-size:12px}
.mi.cur{font-weight:700}
.mi.cur .i{margin-left:auto;color:var(--accent)}
.mi.danger{color:var(--s-late)}
.menu-sep{height:1px;background:var(--hair);margin:6px 4px}
.menu-date{padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px}
.menu-date label{font-size:12px;font-weight:600;color:var(--ink-3)}
.menu-form{padding:8px;display:flex;flex-direction:column;gap:8px;width:290px;max-width:100%}
.menu-form label{font-size:13px;font-weight:600;color:var(--ink-2)}
.menu-form .form-f{padding:0;border:0}
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));z-index:61;width:min(420px,calc(100% - 24px));display:flex;flex-direction:column;border-radius:20px;transform:translateX(calc(100% + 24px));transition:transform .45s var(--ease);overflow:hidden}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px 20px}
.dr-h h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.02em}
.dr-a{display:flex;align-items:center;gap:6px}
.dr-b{flex:1;overflow:auto;padding:0 0 12px}
.dr-g{font-size:12px;font-weight:600;color:var(--ink-3);padding:12px 20px 4px}
.dr-f{padding:12px 20px;border-top:1px solid var(--hair)}
.als{list-style:none;margin:0;padding:0 8px}
.al{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;padding:10px;border-radius:12px;text-align:left;transition:background .15s}
.al:hover{background:var(--wash)}
.al-i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--wash);color:var(--ink-2)}
.al-i.k-late{color:var(--s-late)}.al-i.k-done,.al-i.k-approved{color:var(--s-done)}.al-i.k-remark{background:var(--marker-wash);color:var(--ink)}
.al-m{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13.5px;color:var(--ink-2)}
.al-m b{color:var(--ink);font-weight:600}
.al-m q{color:var(--ink);font-weight:550}
.al-s{display:flex;gap:8px;font-size:12px;color:var(--ink-4)}
.al .new-dot{margin-top:6px}

function prow(p,{actions="",extra="",lead=S.role==="lead"}={}){const c=p.c;return `<div class="row${lead?"":" nolead"}" data-row="${p.id}">${lead?av(c.member):""}<div class="row-main"><a class="row-t" href="${caseHref(c)}" data-open="${p.id}">${esc(p.text)}</a><div class="sub"><span class="cid">${c.id}</span><span class="trunc">${esc(c.subject)}</span></div>${extra}</div><div class="row-act">${actions}</div></div>`}
function actLine(e,p,c){const w=`<b>${esc(who(e.by).first)}</b>`,a=`<a href="${caseHref(c)}" data-open="${p.id}">${esc(p.text)}</a>`;
 switch(e.t){case"update":return `${w} posted an update on ${a}`;case"remark":return `${w} added a remark on ${a}`;
 case"status":return e.to==="approved"?`${w} approved ${a}`:`${w} moved ${a} to ${pillS(e.to)}`;
 case"reopen":return `${w} reopened ${a}`;case"due":return e.to?`${w} set ${a} due ${fmtD(D(e.to))}`:`${w} removed the deadline on ${a}`;
 default:return `${w} added ${a}`}}
function activity(limit){const items=[];vis().forEach(c=>c.points.forEach(p=>p.log.forEach(e=>items.push({e,p,c}))));items.sort((a,b)=>b.e.at.localeCompare(a.e.at));
 return items.slice(0,limit).map(({e,p,c})=>`<li class="act">${av(e.by)}<div><div>${actLine(e,p,c)}</div>${e.text?`<div class="act-q">${e.t==="remark"?'<span class="kind remark">Remark</span> ':""}${esc(e.text)}</div>`:""}</div><time>${fmtAgo(e.at)}</time></li>`).join("")}

const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"};
const showAll=n=>n>3?`<button class="row-more" data-act="expand">Show all ${n}</button>`:"";
function vLeadHome(){const ps=S.cases.flatMap(c=>c.points);const open=ps.filter(p=>p.status!=="approved");const late=open.filter(isLate).sort((a,b)=>lateBy(b)-lateBy(a));
 const review=ps.filter(p=>p.status==="done").sort((a,b)=>lastAt(b).localeCompare(lastAt(a)));const openCases=S.cases.filter(c=>!caseClosed(c));
 const soon=open.filter(p=>!isLate(p)&&p.status!=="done"&&p.due&&dd(D(p.due),TODAY)<=2).sort(byDue);
 const revMembers=new Set(review.map(p=>p.c.member)).size;
 const lede=`${review.length?`<b>${pl(review.length,"point")}</b> ${review.length===1?"is":"are"} ready for your review`:"Nothing is waiting for your review"}${late.length?`, and <b>${late.length} ${late.length===1?"is":"are"} past due</b>.`:"."}`;
 const revRows=review.map(p=>{const last=[...p.log].reverse().find(e=>e.t==="update");return prow(p,{extra:last?`<div class="quote">${esc(last.text)}</div>`:"",actions:`<button class="btn btn-sm" data-act="reopen" data-id="${p.id}">Reopen</button><button class="btn btn-sm btn-primary" data-act="approve" data-id="${p.id}">${ico("check","i-xs")}Approve</button>`})}).join("");
 const dueAll=[...late,...soon],dueRows=dueAll.slice(0,6).map(p=>prow(p,{actions:`${pill(p)}${due(p)}`})).join("")+(dueAll.length>6?`<a class="row nolead more-row" href="#board"><span class="row-t">${dueAll.length-6} more on the board</span><span class="row-act">${ico("back","i-xs flip")}</span></a>`:"");
 const toggle=k=>`<div class="seg" role="group" aria-label="Show as"><button data-act="chart-mode" data-chart="${k}" data-v="chart" aria-pressed="${(S.chartMode[k]||"chart")==="chart"}">Chart</button><button data-act="chart-mode" data-chart="${k}" data-v="table" aria-pressed="${S.chartMode[k]==="table"}">Table</button></div>`;
 const legend=`<div class="legend">${["todo","progress","wait","done"].map(k=>`<span class="st-${k}"><i></i>${k==="done"?"Done, needs review":ST[k].l}</span>`).join("")}</div>`;
 return `<header class="ph"><div><div class="date">${fmtLong(TODAY)}</div><h1 class="h1">${greet()}, ${LEAD.first}</h1><p class="lede">${lede}</p></div><div class="ph-act m-hide"><a class="btn" href="#board">${ico("board","i-xs")}Open board</a></div></header>
 <section class="stats" aria-label="Key numbers">
  ${stat({label:"Open points",value:open.length,ctx:`across ${pl(openCases.length,"open case")}`,href:"#cases",attrs:'data-act="filt" data-k="cases" data-v="open"',cls:"m-hide"})}
  ${stat({label:"Ready for review",value:review.length,ctx:review.length?`from ${pl(revMembers,"member")}`:"All caught up",icon:glyph("done"),href:"#board"})}
  ${stat({label:"Past due",value:late.length,ctx:late.length?`oldest is ${pl(lateBy(late[0]),"day")} late`:"Everything is on time",icon:late.length?'<i class="dot"></i>':"",href:"#cases",attrs:'data-act="filt" data-k="cases" data-v="late"'})}
  ${stat({label:"On-time rate",value:'84<small>%</small>',ctx:"points closed by their date, last 30 days",cls:"m-hide"})}
 </section>
 <div class="grid2">
  ${panel("Ready for your review",review.length,review.length?`<div class="rows clip">${revRows}</div>${showAll(review.length)}`:`<div class="empty">Nothing to review. Points show up here when someone marks them done.</div>`,{tour:"review"})}
  ${panel("Coming up",dueAll.length,dueRows?`<div class="rows clip">${dueRows}</div>${showAll(Math.min(dueAll.length,6)+(dueAll.length>6?1:0))}`:`<div class="empty">Nothing is late or due in the next two days.</div>`)}
 </div>
 <div class="grid2 even">
  ${panel("Open points by member",null,`${(S.chartMode.workload||"chart")==="chart"?legend:""}<div class="chart" data-chart="workload"></div>`,{right:toggle("workload")})}
  ${panel("New cases per week",null,`<div class="chart" data-chart="weekly"></div>`,{right:toggle("weekly")})}
 </div>
 ${panel("Recent activity",null,`<ol class="acts clip">${activity(6)}</ol>${showAll(6)}`)}`}

function vMemberHome(){const me=who(S.me);const cs=vis();const ps=cs.flatMap(c=>c.points);const open=ps.filter(p=>p.status!=="approved");const work=open.filter(p=>p.status!=="done");
 const late=work.filter(isLate);const today=work.filter(p=>p.due&&dd(D(p.due),TODAY)===0);const week=work.filter(p=>p.due&&!isLate(p)&&dd(D(p.due),TODAY)<=6);const withLead=ps.filter(p=>p.status==="done");
 const parts=[];if(today.length)parts.push(`<b>${pl(today.length,"point")} due today</b>`);if(late.length)parts.push(`<b>${late.length} past due</b>`);
 const lede=parts.length?`You have ${parts.join(" and ")}.`:"Nothing is due today, and nothing is late.";
 const next=work.slice().sort((a,b)=>(isLate(b)-isLate(a))||byDue(a,b)).slice(0,7);
 const rmks=[];cs.forEach(c=>c.points.forEach(p=>p.log.forEach(e=>{if(e.t==="remark")rmks.push({e,p,c})})));rmks.sort((a,b)=>b.e.at.localeCompare(a.e.at));
 const newR=rmks.filter(r=>r.e.unread).length;
 const rmkHtml=rmks.slice(0,4).map(({e,p,c})=>`<li class="rmk"><div class="rmk-h">${av("lead","av-xs")}<b>${LEAD.first}</b><time>${fmtAgo(e.at)}</time>${e.unread?'<span class="new-dot" title="New"></span>':""}</div><p class="rmk-t">${esc(e.text)}</p><a class="rmk-on" href="${caseHref(c)}" data-open="${p.id}"><span>On: ${esc(p.text)}</span><span class="cid">${c.id}</span></a></li>`).join("");
 const openCs=cs.filter(c=>!caseClosed(c));
 const myCases=openCs.map(c=>{const appr=c.points.filter(p=>p.status==="approved").length;return `<a class="row nolead" href="${caseHref(c)}"><div class="row-main"><span class="row-t">${esc(c.subject)}</span><div class="sub"><span class="cid">${c.id}</span><span>${esc(c.from.org||c.from.name)}</span></div></div><div class="row-act">${segbar(c)}<span class="small tnum muted">${appr}/${c.points.length}</span></div></a>`}).join("");
 return `<header class="ph"><div><div class="date">${fmtLong(TODAY)}</div><h1 class="h1">${greet()}, ${esc(me.first)}</h1><p class="lede">${lede}</p></div><div class="ph-act m-hide"><a class="btn btn-primary" href="#add">${ico("plus","i-xs")}Add email</a></div></header>
 <section class="stats" aria-label="Key numbers">
  ${stat({label:"Open points",value:work.length,ctx:`across ${pl(openCs.length,"case")}`,href:"#board",cls:"m-hide"})}
  ${stat({label:"Due this week",value:week.length,ctx:"in the next 7 days"})}
  ${stat({label:"Past due",value:late.length,ctx:late.length?`oldest is ${pl(Math.max(...late.map(lateBy)),"day")} late`:"You're on time",icon:late.length?'<i class="dot"></i>':""})}
  ${stat({label:`With ${LEAD.first} for review`,value:withLead.length,ctx:"marked done",icon:glyph("done"),cls:"m-hide"})}
 </section>
 <div class="grid2">
  ${panel("Your next steps",work.length,next.length?`<div class="rows clip">${next.map(p=>prow(p,{lead:false,actions:`${pill(p)}${due(p)}`})).join("")}</div>${showAll(next.length)}`:`<div class="empty">You have no open points. Add an email to start tracking new work.</div>`,{tour:"next"})}
  ${panel(`Remarks from ${LEAD.first}`,newR?`${newR} new`:null,rmkHtml?`<ul class="rmks">${rmkHtml}</ul>`:`<div class="empty">No remarks yet. ${LEAD.first}'s notes on your points show up here.</div>`)}
 </div>
 ${panel("Your open cases",openCs.length,`<div class="rows">${myCases}</div>`)}`}

/* ---------- views: cases + board ---------- */
function memberChips(key,val){return `<div class="chips" role="group" aria-label="Owner"><button class="chip all" data-act="filt" data-k="${key}" data-v="all" aria-pressed="${val==="all"}">Everyone</button>${activeMembers().map(m=>`<button class="chip" data-act="filt" data-k="${key}" data-v="${m.id}" aria-pressed="${val===m.id}">${av(m.id,"av-xs")}${esc(m.first)}</button>`).join("")}</div>`}
const viewSwitch=cur=>`<div class="seg" role="group" aria-label="View"><a href="#cases"${cur==="cases"?' aria-current="page"':""}>${ico("cases","i-xs")}List</a><a href="#board"${cur==="board"?' aria-current="page"':""}>${ico("board","i-xs")}Board</a></div>`;
function caseRow(c){const lead=S.role==="lead";const open=c.points.filter(p=>!closedSt(p.status));const next=open.filter(p=>p.due).sort(byDue)[0];const appr=c.points.filter(p=>p.status==="approved").length;
 return `<a class="crow${lead?"":" nm"}" href="${caseHref(c)}"><span class="c-id cid">${c.id}</span><span class="c-main"><span class="c-subj">${esc(c.subject)}</span><span class="c-from"><span class="cid cid-m">${c.id}</span><span class="trunc">${esc(c.from.org||c.from.name)}</span></span></span>${lead?`<span class="c-mem">${av(c.member)}<span>${esc(who(c.member).first)}</span></span>`:""}<span class="c-prog">${segbar(c)}<span class="tnum small muted">${appr}/${c.points.length}</span></span><span class="c-due">${caseClosed(c)?'<span class="stamp sm">Closed</span>':next?due(next,{btn:false}):open.length?'<span class="due none"><span>No deadline</span></span>':'<span class="small muted">In review</span>'}</span><span class="c-prio">${prio(c.priority)}</span></a>`}
function vCases(){const lead=S.role==="lead",f=S.filt;let list=vis();if(lead&&f.member!=="all")list=list.filter(c=>c.member===f.member);
 const tests={open:c=>!caseClosed(c),late:c=>c.points.some(isLate),review:c=>c.points.some(p=>p.status==="done"),closed:caseClosed,all:()=>true};
 const counts={};Object.keys(tests).forEach(k=>counts[k]=list.filter(tests[k]).length);
 list=list.filter(tests[f.cases]||tests.open);const q=f.q.trim().toLowerCase();
 if(q)list=list.filter(c=>`${c.id} ${c.subject} ${c.from.name} ${c.from.org} ${c.points.map(p=>p.text).join(" ")}`.toLowerCase().includes(q));
 list=list.slice().sort((a,b)=>{const ca=caseClosed(a),cb=caseClosed(b);if(ca!==cb)return ca-cb;if(ca)return b.received.localeCompare(a.received);const na=a.points.filter(p=>!closedSt(p.status)&&p.due).sort(byDue)[0],nb=b.points.filter(p=>!closedSt(p.status)&&p.due).sort(byDue)[0];return byDue(na||{},nb||{})});
 const labels=[["open","Open"],["late","Past due"],["review","Needs review"],["closed","Closed"],["all","All"]];
 return `<header class="ph"><div><h1 class="h1">Cases</h1><p class="lede opt">${lead?"Every email the team is working on, one case per email.":"Every email you're working on, one case per email."}</p></div><div class="ph-act">${viewSwitch("cases")}<a class="btn btn-primary m-hide" href="#add">${ico("plus","i-xs")}Add an email</a></div></header>
 <div class="filters"><div class="seg" role="group" aria-label="Show">${labels.map(([k,l])=>`<button data-act="filt" data-k="cases" data-v="${k}" aria-pressed="${f.cases===k}">${l}<span class="n">${counts[k]}</span></button>`).join("")}</div>${lead?memberChips("member",f.member):""}<label class="find">${ico("search","i-xs")}<span class="sr">Filter cases</span><input id="case-q" type="search" placeholder="Filter by sender, subject or ID" value="${esc(f.q)}" autocomplete="off"></label></div>
 <section class="panel" aria-label="Cases"><div class="list"><div class="crow h${lead?"":" nm"}" aria-hidden="true"><span class="c-id">ID</span><span>Email</span>${lead?'<span class="c-mem">Owner</span>':""}<span class="c-prog">Points approved</span><span class="c-due">Next deadline</span><span class="c-prio">Priority</span></div>${list.map(caseRow).join("")||`<div class="empty">No cases match. Try another filter, or add an email.</div>`}</div></section>`}

function card(p){const c=p.c,lead=S.role==="lead",canMove=!(S.role==="member"&&p.status==="approved");
 return `<article class="card" data-card="${p.id}" tabindex="0" draggable="${canMove}" aria-label="${esc(p.text)}, ${ST[p.status].l}"><div class="card-top"><span class="cid">${c.id} · ${p.src||"+"}</span>${c.priority==="high"?prio("high"):""}${canMove?`<button class="icon-btn" data-act="status-menu" data-id="${p.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Change status">${ico("more","i-xs")}</button>`:""}</div><div class="card-t">${esc(p.text)}</div>${p.status==="wait"&&p.wait?`<div class="card-w">${ico("clock","i-xs")}<span>${esc(p.wait)}</span></div>`:""}<div class="card-s">${esc(c.subject)}</div><div class="card-f">${lead?av(c.member,"av-xs"):"<span></span>"}${p.status==="approved"?`<span class="stamp sm">${ico("check","i-xs")}${(()=>{const e=[...p.log].reverse().find(x=>x.t==="status"&&x.to==="approved");return e?fmtS(D(e.at)):"Approved"})()}</span>`:due(p,{btn:false})}</div></article>`}
function vBoard(){const lead=S.role==="lead";let cs=vis();if(lead&&S.boardMember!=="all")cs=cs.filter(c=>c.member===S.boardMember);const ps=cs.flatMap(c=>c.points);
 const empty={todo:"Nothing waiting to start",progress:"Nothing in progress",wait:"Nothing is blocked",done:lead?"Nothing to review":"Nothing waiting for review",approved:"Nothing approved yet"};
 const cols=ORDER.map(s=>{let items=ps.filter(p=>p.status===s);if(s==="approved")items.sort((a,b)=>lastAt(b).localeCompare(lastAt(a)));else items.sort((a,b)=>(isLate(b)-isLate(a))||byDue(a,b));
  const shown=s==="approved"?items.slice(0,4):items;const more=items.length-shown.length;
  return `<section class="col st-${s}" data-col="${s}" aria-label="${ST[s].l}"><div class="col-h">${glyph(s)}<span>${s==="done"?"Done, needs review":ST[s].l}</span><span class="count">${items.length}</span></div><div class="col-b">${shown.map(card).join("")}${more>0?`<div class="more">and ${more} more</div>`:""}${items.length?"":`<div class="col-empty">${empty[s]}</div>`}</div></section>`}).join("");
 const sw=ORDER.map(s=>`<button data-act="board-col" data-v="${s}" aria-pressed="${S.boardCol===s}">${glyph(s)}${s==="done"?"Done":ST[s].l}<span class="n">${ps.filter(p=>p.status===s).length}</span></button>`).join("");
 return `<header class="ph"><div><h1 class="h1">Board</h1><p class="lede opt">${lead?"Every open point by status. Drag a card to move it, or drop it on Approved to sign it off.":`Your points by status. Drag a card to move it. ${LEAD.first} approves points you mark done.`}</p></div><div class="ph-act">${viewSwitch("board")}</div></header>
 ${lead?`<div class="filters">${memberChips("boardMember",S.boardMember)}</div>`:""}
 <div class="seg board-switch" role="group" aria-label="Show status">${sw}</div><div class="board-wrap"><div class="board" data-show="${S.boardCol}">${cols}</div></div><p class="hint m-hide">Tip: open a card's menu, or press Enter on it, if you'd rather not drag.</p>`}

/* ---------- views: case ---------- */
function tlItem(e){const w=who(e.by);
 if(e.t==="update"||e.t==="remark")return `<li>${av(e.by)}<div><div class="who"><b>${esc(w.name)}</b><span class="kind${e.t==="remark"?" remark":""}">${e.t==="remark"?"Remark":"Update"}</span><time>${fmtAt(e.at)}</time></div><div class="txt">${esc(e.text)}</div></div></li>`;
 let t="",g=ico("dot","i-xs");
 if(e.t==="status"){g=glyph(e.to);t=e.to==="approved"?`<b>${esc(w.first)}</b> approved this point`:e.to==="wait"?`<b>${esc(w.first)}</b> set this to Waiting${e.reason?`: ${esc(e.reason)}`:""}`:`<b>${esc(w.first)}</b> moved this to ${ST[e.to].l}`}
 else if(e.t==="reopen"){g=ico("undo","i-xs");t=`<b>${esc(w.first)}</b> reopened this point`}
 else if(e.t==="due"){g=ico("cal","i-xs");t=e.to?`<b>${esc(w.first)}</b> set the deadline to ${fmtD(D(e.to))}`:`<b>${esc(w.first)}</b> removed the deadline`}
 else t=`<b>${esc(w.first)}</b> added this point`;
 return `<li class="sys"><span class="sys-g">${g}</span><div class="who">${t}<time>${fmtAt(e.at)}</time></div></li>`}
function composer(p,c){const lead=S.role==="lead",id=`cmp-${p.id}`;return `<form class="comp" data-act-form="post" data-id="${p.id}"><label class="sr" for="${id}">${lead?"Remark":"Update"}</label><textarea id="${id}" class="inp" rows="2" placeholder="${lead?`Add a remark for ${esc(who(c.member).first)}`:"What changed? Post an update"}">${esc(S.compose[p.id]||"")}</textarea><div class="comp-f"><span class="hint">${MOD} + Enter to post</span><button class="btn btn-sm btn-primary" type="submit">${lead?"Add remark":"Post update"}</button></div></form>`}
function reviewBar(p,c){if(p.status!=="done")return"";if(S.role==="lead")return `<div class="review">${glyph("done")}<span><b>${esc(who(c.member).first)}</b> marked this done.</span><span class="sp"></span><button class="btn btn-sm" data-act="reopen" data-id="${p.id}">Reopen</button><button class="btn btn-sm btn-primary" data-act="approve" data-id="${p.id}">${ico("check","i-xs")}Approve</button></div>`;
 return `<div class="review note">${glyph("done")}<span>Marked done. Waiting for ${LEAD.first} to approve it.</span></div>`}
function ptCard(p,c){const open=S.open.has(p.id),ups=p.log.filter(e=>e.t==="update").length,rms=p.log.filter(e=>e.t==="remark").length;
 return `<li class="pt${open?" open":""}${p.status==="approved"?" is-approved":""}" id="pt-${p.id}"${p.src?` data-src-of="${p.src}"`:""}><div class="pt-row">${p.src?`<span class="tag">${p.src}</span>`:`<span class="tag tag-none" title="Added by hand">+</span>`}<div><button class="pt-text" data-act="toggle-pt" data-id="${p.id}" aria-expanded="${open}">${esc(p.text)}</button>${p.status==="wait"&&p.wait?`<div class="pt-wait">${ico("clock","i-xs")}<span>Waiting on: ${esc(p.wait)}</span></div>`:""}<div class="pt-meta">${pill(p)}${due(p)}${ups+rms?`<span class="pt-count">${ico("msg","i-xs")}${pl(ups,"update")}${rms?` · ${pl(rms,"remark")}`:""}</span>`:""}${approvedStamp(p)}</div></div><button class="pt-tog" data-act="toggle-pt" data-id="${p.id}" aria-expanded="${open}" aria-label="${open?"Hide":"Show"} updates">${ico("chevD")}</button></div>${open?`<div class="pt-body">${reviewBar(p,c)}${p.log.length?`<ol class="tl">${p.log.map(tlItem).join("")}</ol>`:`<p class="hint" style="margin:0">No updates yet.</p>`}${composer(p,c)}${p.src?`<button class="link-btn m-only" data-act="show-src" data-v="${p.src}">Show this in the email</button>`:""}</div>`:""}</li>`}
function prioSeg(id,val){return `<div class="seg" role="radiogroup" id="${id}" aria-label="Priority">${["low","normal","high"].map(v=>`<button type="button" role="radio" aria-checked="${v===val}" aria-pressed="${v===val}" data-act="prio-pick" data-for="${id}" data-v="${v}">${prio(v)}</button>`).join("")}</div>`}
function vCase(id){const c=findCase(id);if(!c)return vMissing();if(S.role==="member"&&c.member!==S.me)return `<div class="ph"><div><h1 class="h1">This case belongs to someone else</h1><p class="lede">Members only see their own cases. Ask ${LEAD.first} if you need access.</p></div></div><a class="btn" href="#cases" style="align-self:flex-start">Go to my cases</a>`;
 const total=c.points.length,appr=c.points.filter(p=>p.status==="approved").length,lead=S.role==="lead";
 const head=S.editCase===c.id?`<form class="case-h panel" data-act-form="save-case" data-id="${c.id}" style="padding:16px;gap:14px"><div class="case-top"><span class="cid big">${c.id}</span><span class="hint">Editing details</span></div>
  <div class="field"><label for="ec-t">Title</label><input id="ec-t" class="inp inp-lg" value="${esc(c.subject)}" required></div>
  <div class="field"><label for="ec-s">Summary</label><textarea id="ec-s" class="inp" rows="2">${esc(c.summary)}</textarea></div>
  <div class="fields-row"><div class="field"><span class="flabel">Priority</span>${prioSeg("ec-p",c.priority)}</div><div class="field"><label for="ec-org">Company</label><input id="ec-org" class="inp" value="${esc(c.from.org)}"></div>${lead?`<div class="field"><label for="ec-o">Owner</label><select id="ec-o" class="inp">${activeMembers().map(m=>`<option value="${m.id}"${m.id===c.member?" selected":""}>${esc(m.name)}</option>`).join("")}</select></div>`:""}</div>
  <div class="form-f" style="padding:0;border:0"><button type="button" class="btn" data-act="cancel-edit">Cancel</button><button class="btn btn-primary" type="submit">Save details</button></div></form>`

/* ---------- charts ---------- */
const WK=["todo","progress","wait","done"];
function workData(){return activeMembers().map(m=>{const o={m,todo:0,progress:0,wait:0,done:0};S.cases.filter(c=>c.member===m.id).forEach(c=>c.points.forEach(p=>{if(p.status in o)o[p.status]++}));o.total=o.todo+o.progress+o.wait+o.done;return o})}
function workSvg(w){const data=workData(),narrow=w<400,labW=narrow?62:104,endW=30,rowH=40,barH=18;const maxT=Math.max(1,...data.map(d=>d.total));const sc=(w-labW-endW)/maxT;const h=data.length*rowH;
 let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Open points by member and status">`;
 data.forEach((d,i)=>{const y=i*rowH+(rowH-barH)/2,cy=i*rowH+rowH/2;s+=`<text x="0" y="${cy}" dominant-baseline="middle" class="t-lab">${esc(narrow?d.m.first:d.m.name)}</text>`;
  if(!d.total){s+=`<text x="${labW}" y="${cy}" dominant-baseline="middle" class="t-mut">No open points</text>`;return}
  let x=labW;const segs=WK.filter(k=>d[k]>0);
  segs.forEach((k,j)=>{const segW=d[k]*sc,last=j===segs.length-1,ww=Math.max(1,segW-(last?0:2));
   if(last){const r=Math.min(4,ww/2);s+=`<path d="M${x},${y}H${x+ww-r}Q${x+ww},${y} ${x+ww},${y+r}V${y+barH-r}Q${x+ww},${y+barH} ${x+ww-r},${y+barH}H${x}Z" class="st-${k} seg-f"/>`}
   else s+=`<rect x="${x}" y="${y}" width="${ww}" height="${barH}" class="st-${k} seg-f"/>`;
   s+=`<rect x="${x}" y="${y-8}" width="${segW}" height="${barH+16}" fill="transparent" class="st-${k}" data-tip="${esc(d.m.name)}|${k==="done"?"Done, needs review":ST[k].l}: ${pl(d[k],"point")}" data-c="${k}" tabindex="0" aria-label="${esc(d.m.name)}, ${ST[k].l}: ${d[k]}"/>`;x+=segW});
  s+=`<text x="${labW+d.total*sc+8}" y="${cy}" dominant-baseline="middle" class="t-val">${d.total}</text>`});
 return s+"</svg>"}
function weekData(){const mon=addDays(TODAY,-((TODAY.getDay()+6)%7));const cur=S.cases.filter(c=>c.received>=iso(mon)).length;const out=[];for(let i=7;i>=0;i--){const d=addDays(mon,-7*i);out.push({d,v:i?S.weekly[7-i]:cur,cur:!i})}return out}
function weekSvg(w){const data=weekData(),h=196,pl_=28,pr=6,pt=24,pb=28;const max=Math.max(4,Math.ceil(Math.max(...data.map(d=>d.v))/4)*4);const ph=h-pt-pb,pw=w-pl_-pr,band=pw/data.length,bw=Math.min(24,band*.52);const Y=v=>pt+ph-(v/max)*ph;
 let s=`<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="New cases per week, last 8 weeks">`;
 [0,max/2,max].forEach(t=>{const y=Y(t);s+=`<line x1="${pl_}" x2="${w-pr}" y1="${y}" y2="${y}" class="${t===0?"base":"gl"}"/><text x="${pl_-8}" y="${y}" text-anchor="end" dominant-baseline="middle" class="t-mut">${t}</text>`});
 data.forEach((d,i)=>{const cx=pl_+band*(i+.5),x0=cx-bw/2,x1=cx+bw/2,y=Y(d.v),yb=Y(0),r=Math.min(4,(yb-y)/2,bw/2);const lab=d.cur?"This week so far":`Week of ${fmtS(d.d)}`;
  if(d.v>0)s+=`<path d="M${x0},${yb}V${y+r}Q${x0},${y} ${x0+r},${y}H${x1-r}Q${x1},${y} ${x1},${y+r}V${yb}Z" class="${d.cur?"bar-cur":"bar-past"}"/>`;
  if(d.cur)s+=`<text x="${cx}" y="${y-8}" text-anchor="middle" class="t-val">${d.v}</text>`;
  if(band>=46||i%2===1)s+=`<text x="${cx}" y="${h-8}" text-anchor="middle" class="t-mut">${d.cur?"This wk":fmtS(d.d)}</text>`;
  s+=`<rect x="${cx-band/2}" y="${pt}" width="${band}" height="${ph}" fill="transparent" data-tip="${lab}|${pl(d.v,"new case")}" tabindex="0" aria-label="${lab}: ${pl(d.v,"new case")}"/>`});
 return s+"</svg>"}
function workTable(){return `<div class="tbl-wrap"><table class="dtable"><thead><tr><th>Member</th>${WK.map(k=>`<th class="n">${ST[k].l}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody>${workData().map(d=>`<tr><td>${esc(d.m.name)}</td>${WK.map(k=>`<td class="n">${d[k]}</td>`).join("")}<td class="n"><b>${d.total}</b></td></tr>`).join("")}</tbody></table></div>`}
